[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pragati-bharati"
version = "1.0.0"
description = "Document Processing & Question Extraction Service for Pragati Bharati ed-tech platform"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/core/celery_app.py", "tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
