services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pragati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pragati_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pragati_bharati}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pragati}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - upload_storage:/app/storage
      - ./app:/app/app
      - ./alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - upload_storage:/app/storage
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.core.celery_app worker
      --loglevel=info
      --concurrency=4
      --max-tasks-per-child=50
      -Q document_processing

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - upload_storage:/app/storage
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.core.celery_app beat
      --loglevel=info

  flower:
    build:
      context: .
      dockerfile: Dockerfile.worker
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      - upload_storage:/app/storage
      - ./app:/app/app
    depends_on:
      - redis
      - worker
    command: >
      celery -A app.core.celery_app flower
      --port=5555

volumes:
  postgres_data:
  redis_data:
  upload_storage:
